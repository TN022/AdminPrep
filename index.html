let historyData={};try{historyData=JSON.parse(localStorage.getItem('adminprep-2026-v1')||'{}')}catch(e){};let app=document.getElementById('app'),session=null,timer;const save=()=>{try{localStorage.setItem('adminprep-2026-v1',JSON.stringify(historyData))}catch(e){}};const tabs={'Painel':dashboard,'Plano de estudos':plan,'Teoria':theory,'Questões':setup,'Caderno de erros':errors,'Prova anterior':sources,'Provas reais':real,'Edital 2026':edital2026,'Videoaulas':videos};for(const [name,fn] of Object.entries(tabs)){let b=document.createElement('button');b.textContent=name;b.onclick=()=>{clearInterval(timer);fn()};nav.append(b)}function dashboard(){let v=Object.values(historyData),total=v.reduce((s,x)=>s+x.total,0),ok=v.reduce((s,x)=>s+x.ok,0);app.innerHTML=`<h2>Seu desempenho</h2><div class=grid>${[['Questões autorais',Q.filter(q=>!["Português","Inglês"].includes(q.t)).length],['Respostas realizadas',total],['Acertos',total?Math.round(ok/total*100)+'%':'—'],['Cobertura',Math.round(v.length/Q.length*100)+'%']].map(([n,x])=>`<article>${n}<div class=metric>${x}</div></article>`).join('')}</div><h3>Por assunto</h3>`+Object.keys(L).map(t=>{let ids=Q.map((q,i)=>q.t===t?i:-1).filter(i=>i>=0),a=ids.map(i=>historyData[i]).filter(Boolean),n=a.reduce((s,x)=>s+x.total,0),k=a.reduce((s,x)=>s+x.ok,0);return `<p>${t} — ${n?Math.round(k/n*100)+'%':'não iniciado'}<progress max=100 value=${n?k/n*100:0}></progress></p>`}).join('')}function plan(){app.innerHTML='<h2>Plano de 8 semanas</h2><p>Sugestão: 2 horas por dia, 6 dias por semana. 60 min teoria, 40 min questões, 20 min revisão. Revise em D+1, D+7 e D+30. Reserve 30% do tempo para Português e Inglês.</p>'+['Finanças e contabilidade','Produção e compras','Contratação e projetos','Estratégia e marketing','RH e negociação','Sistemas de informação e decisão','Lógica, estatística e sustentabilidade','Simulados, revisão de erros e prova anterior'].map((x,i)=>`<article><h3>Semana ${i+1}</h3><p>${x}</p><label><input type=checkbox ${localStorage.getItem('apweek'+i)==='1'?'checked':''} onchange="localStorage.setItem('apweek${i}',this.checked?'1':'0')"> Semana concluída</label></article>`).join('')}const expandedTheory={"Finanças": [["Valor do dinheiro no tempo: em juros simples, J=C×i×n e M=C+J; em compostos, M=C(1+i)^n. Taxa e prazo precisam estar na mesma unidade. Taxas efetivas equivalentes satisfazem (1+i anual)=(1+i mensal)^12. Inflação: taxa real=(1+nominal)/(1+inflação)−1.", "R$ 10.000 a 2% ao mês por três meses resultam em R$ 10.600 no regime simples e R$ 10.612,08 no composto.", "Não divida uma taxa efetiva anual por 12 para obter a equivalente mensal."], ["Avaliação de investimentos: VPL=−I₀+Σ FCt/(1+k)^t. Aceite projeto independente com VPL positivo. TIR é a taxa que zera o VPL; compare com a taxa mínima de atratividade quando os fluxos forem convencionais. Payback simples mede recuperação nominal; descontado considera o custo de capital. WACC=E/(D+E)×Ke+D/(D+E)×Kd×(1−T), sob hipótese de benefício fiscal aplicável.", "Investimento de 100 mil e retorno de 121 mil em dois anos, a 10% ao ano: VPL=0 e TIR=10%.", "Projetos mutuamente exclusivos podem ter rankings diferentes por TIR e VPL; fluxos não convencionais podem gerar múltiplas TIRs."], ["Capital de giro líquido=ativo circulante−passivo circulante. Ciclo financeiro=prazo médio de estoque+prazo médio de recebimento−prazo médio de pagamento. Orçamento de caixa projeta entradas e saídas; orçamento base zero exige justificar gastos. Alavancagem financeira amplia efeitos do endividamento sobre o retorno dos sócios e também o risco.", "Estoque de 40 dias, recebimento de 30 e pagamento de 25: ciclo financeiro de 45 dias.", "Lucro não é caixa; debênture representa dívida, não participação societária."]], "Produção e compras": [["PCP planeja capacidade, materiais, sequenciamento e controle. MRP calcula necessidades dependentes usando plano mestre, lista de materiais e registros de estoque. JIT busca fluxo puxado e redução de desperdícios; Kanban sinaliza reposição. Cadeia de suprimentos integra fornecedores, operações e clientes.", "Para 100 produtos que exigem 3 peças cada, com 40 peças disponíveis e sem outros ajustes, necessidade líquida=260 peças.", "MRP não é sinônimo de JIT; demanda dependente deriva da necessidade de outro item."], ["Ponto de pedido=d×L+ES, com demanda média d, prazo L e estoque de segurança ES. Lote econômico Q*=√(2DS/H), com demanda anual D, custo por pedido S e custo anual de manutenção unitário H. Curva ABC classifica itens normalmente pelo valor anual de consumo. RFID usa radiofrequência; código de barras normalmente exige leitura óptica.", "Consumo de 20 unidades/dia, prazo de 5 dias e segurança de 30: ponto de pedido=130 unidades.", "Classe A não significa necessariamente maior quantidade física. O lote econômico clássico pressupõe demanda estável e outras simplificações."]], "Contratação": [["A Lei 13.303/2016 rege licitações e contratos das empresas estatais abrangidas. A licitação é regra; dispensa depende de hipótese legal, enquanto inexigibilidade decorre da inviabilidade de competição. A matriz de riscos distribui responsabilidades por eventos contratuais. Julgamento objetivo exige critérios previamente definidos.", "Uma contratação de fornecedor exclusivo pode configurar inexigibilidade se comprovada a inviabilidade de competição e cumpridos os requisitos legais.", "Não aplique automaticamente a Lei 14.133/2021 às estatais. Consulte arts. 28–91 da Lei 13.303 e regulamento interno."], ["A LC 123/2006 prevê tratamento favorecido a ME/EPP. A regularidade fiscal e trabalhista é exigida para assinatura do contrato, embora a documentação deva ser apresentada na participação. Havendo restrição, a lei prevê cinco dias úteis para regularização, prorrogáveis por igual período. Empate ficto: até 10% acima da melhor proposta, ou até 5% no pregão, observadas as condições legais.", "Em pregão, melhor proposta de empresa não beneficiária é R$100 mil; ME/EPP oferece R$104 mil: pode enquadrar-se no empate ficto.", "Benefício não significa vitória automática: há procedimento para oferta inferior e condições legais de aplicação."]], "Projetos": [["Projeto é esforço temporário para resultado único; operação é contínua. EAP decompõe escopo em entregas e pacotes de trabalho. Caminho crítico é o caminho de maior duração na rede, determinando o prazo mínimo nas condições planejadas. PMBOK 7 enfatiza princípios, domínios de desempenho, entrega de valor e adaptação.", "Caminhos A–B de 8 dias e C–D de 11 dias: duração mínima de 11 dias se ambos começam juntos e não há restrições adicionais.", "EAP não é cronograma. Pode existir mais de um caminho crítico."], ["Scrum organiza trabalho em Sprints de até um mês. Product Owner maximiza valor e responde pela gestão eficaz do Product Backlog; Scrum Master promove a efetividade do Scrum; Developers criam o incremento. Kanban visualiza fluxo, limita trabalho em andamento e melhora continuamente.", "Uma equipe limita a três tarefas simultâneas na coluna de execução para reduzir filas.", "Daily Scrum é evento dos Developers, não reunião obrigatória de prestação de contas ao gerente."]], "Conflitos e negociação": [["BATNA é a melhor alternativa caso não haja acordo; ZOPA é a faixa de resultados aceitáveis para ambas as partes. Negociação distributiva divide valor existente; integrativa busca criar valor por interesses complementares. Separe posições declaradas de interesses subjacentes.", "Comprador aceita até 110 e vendedor aceita no mínimo 95: ZOPA de 95 a 110.", "BATNA não é preço de reserva, embora influencie esse limite."], ["Estilos de conflito variam em assertividade e cooperação: competição, acomodação, evitação, compromisso e colaboração. Mediação facilita diálogo sem impor solução; arbitragem envolve decisão do árbitro nos termos aplicáveis.", "Dois setores disputam equipamentos; colaboração pode reorganizar horários para atender ambos.", "Compromisso envolve concessões; colaboração procura satisfazer interesses de ambas as partes."]], "Sistemas de informação": [["SPT registra transações rotineiras; SIG consolida informações gerenciais; SAD auxilia decisões semiestruturadas; BI analisa dados e indicadores. ERP integra processos e dados de áreas como compras, estoque e finanças. CRM organiza relacionamento com clientes.", "Uma compra registrada no ERP atualiza estoque e contas a pagar; BI mostra tendências de custo.", "ERP não é exclusivamente financeiro; BI não substitui julgamento gerencial."], ["Data warehouse integra dados históricos para análise; ETL extrai, transforma e carrega dados. OLTP privilegia transações; OLAP privilegia análise multidimensional. Governança de dados define responsabilidades, qualidade, acesso e proteção.", "Gestor compara despesas por terminal, mês e categoria em um painel analítico.", "Dado bruto não é necessariamente informação útil; sistema operacional gerencia recursos computacionais, não é um SIG."]], "Estratégia": [["Planejamento estratégico define direção ampla; tático desdobra objetivos por áreas; operacional detalha atividades. SWOT distingue forças e fraquezas internas de oportunidades e ameaças externas. Cinco forças de Porter avaliam estrutura competitiva do setor.", "Equipe especializada é força; entrada de concorrente é ameaça.", "SWOT não confunde fatores externos favoráveis com forças internas."], ["BCG cruza participação relativa e crescimento do mercado: estrela, vaca leiteira, interrogação e abacaxi. BSC traduz estratégia em objetivos, indicadores, metas e iniciativas nas perspectivas financeira, clientes, processos internos e aprendizado/crescimento. VRIO examina valor, raridade, dificuldade de imitação e organização.", "Negócio com alta participação e baixo crescimento é vaca leiteira na matriz BCG.", "BSC não se restringe a indicadores financeiros; recurso valioso mas comum não gera vantagem sustentável por si só."], ["Porter distingue liderança em custos, diferenciação e enfoque. Estrutura funcional agrupa especialidades; divisional agrupa produtos ou regiões; matricial combina dimensões de autoridade. Integração vertical amplia controle de etapas da cadeia; diversificação amplia negócios.", "Uma empresa passa a executar internamente uma atividade antes contratada de fornecedor: integração vertical a montante, se for etapa anterior.", "Liderança em custos não exige necessariamente vender pelo menor preço."]], "Marketing": [["Segmentação divide mercado; seleção de alvo escolhe segmentos; posicionamento define percepção desejada. Os 4 Ps são produto, preço, praça e promoção. Marketing B2B envolve compradores organizacionais e frequentemente processos formais de decisão.", "Uma empresa logística direciona serviços a indústrias com necessidade de transporte especializado.", "Segmentação não é posicionamento; promoção é apenas uma parte do marketing."], ["Serviços apresentam intangibilidade, variabilidade, inseparabilidade em muitos casos e perecibilidade da capacidade. Pesquisa exploratória esclarece problemas; descritiva caracteriza fenômenos; causal testa efeitos. Brand equity é valor associado à marca; CRM busca relacionamento e retenção.", "Teste controlado de dois preços para medir impacto nas vendas é pesquisa causal.", "Correlação observada não comprova causalidade; capacidade ociosa de serviço não pode ser estocada."]], "Contabilidade": [["Equação patrimonial: Ativo=Passivo+PL. Débitos aumentam normalmente ativos e despesas; créditos aumentam passivos, PL e receitas. Competência reconhece efeitos quando ocorrem, independentemente do pagamento. BP mostra posição patrimonial; DRE mostra resultado; DFC mostra fluxos de caixa.", "Compra de equipamento à vista troca caixa por imobilizado; não gera despesa integral imediata, em regra.", "ICMS a recolher é obrigação tributária, não capital social. Receita não implica recebimento imediato."], ["Custos diretos são atribuíveis ao objeto de custo; indiretos exigem critérios de apropriação. Fixos não variam com volume dentro de faixa relevante; variáveis acompanham atividade. Absorção inclui custos fixos e variáveis de produção; variável trata fixos produtivos como despesa do período. ABC usa atividades e direcionadores.", "Preço 100, custo e despesa variável 60, fixos 20 mil: margem unitária 40 e ponto de equilíbrio 500 unidades.", "Direto não é sinônimo de variável. Margem de contribuição não é lucro líquido."], ["Governança direciona e monitora; gestão executa. Compliance promove conformidade; controles internos reduzem riscos e apoiam objetivos. Risco inerente existe antes dos controles; residual permanece após tratamento.", "Dupla aprovação de pagamento reduz risco de fraude, mas não o elimina.", "Auditoria interna avalia controles; não deve assumir a responsabilidade gerencial por operá-los."]], "Processo decisório": [["Decisões programadas tratam problemas recorrentes; não programadas enfrentam situações novas. Racionalidade limitada reconhece limites de informação, tempo e capacidade. Valor esperado=Σ probabilidade×resultado; árvore de decisão representa alternativas e eventos.", "Ganho de 100 com chance de 60% e perda de 50 com chance de 40%: valor esperado 40.", "Valor esperado não é garantia de resultado individual."], ["Ancoragem é influência de referência inicial; disponibilidade é influência da facilidade de lembrar; confirmação privilegia evidências favoráveis; escalada de comprometimento mantém decisão ruim por investimento passado. Análise de sensibilidade varia premissas para avaliar robustez.", "Continuar projeto inviável apenas porque já gastou muito é escalada de comprometimento.", "Custos irrecuperáveis não devem determinar a decisão incremental futura."]], "RH": [["Gestão por competências articula conhecimentos, habilidades e atitudes. Recrutamento atrai candidatos; seleção escolhe; treinamento desenvolve capacidades. Avaliação 360 graus reúne múltiplas perspectivas. Remuneração total inclui parcelas fixas, variáveis e benefícios.", "Avaliação por pares, subordinados e chefia amplia perspectivas sobre comportamento.", "Avaliação 360 não elimina vieses automaticamente; treinamento não é sinônimo de seleção."], ["Cultura envolve valores e pressupostos compartilhados; clima é percepção do ambiente. Liderança transformacional inspira mudança; transacional usa trocas e recompensas contingentes. Conhecimento tácito é difícil de codificar; explícito pode ser documentado. Sucessão prepara pessoas para funções críticas.", "Mentoria transfere experiência prática; manual registra conhecimento explícito.", "Clima pode mudar mais rapidamente que cultura. Liderança não depende exclusivamente de autoridade formal."]], "Lógica": [["Função afim f(x)=ax+b; PA: an=a1+(n−1)r e Sn=n(a1+an)/2; PG: an=a1×q^(n−1), Sn=a1(q^n−1)/(q−1), q≠1. Princípio multiplicativo multiplica opções sucessivas.", "PA 5, 8, 11: décimo termo=32. PG 2, 6, 18: quinto termo=162.", "Não confunda diferença constante da PA com razão constante da PG."], ["Permutação de n elementos distintos=n!; arranjo A(n,p)=n!/(n−p)!; combinação C(n,p)=n!/[p!(n−p)!]. Negação de P e Q é não P ou não Q; negação de P ou Q é não P e não Q. Implicação P→Q só é falsa com P verdadeira e Q falsa.", "Escolher 3 de 5 pessoas sem cargos: C(5,3)=10; atribuir 3 cargos distintos: A(5,3)=60.", "Se a ordem muda o resultado, não use combinação simples."]], "Estatística": [["Média ponderada=Σwx/Σw. Mediana é o centro dos dados ordenados; moda é o valor mais frequente. Variância populacional divide a soma dos desvios quadráticos por N; amostral usual divide por n−1. Desvio padrão é a raiz da variância.", "Dados 2, 4, 6: média 4, mediana 4, variância populacional 8/3.", "Média é sensível a extremos; desvio padrão tem a mesma unidade dos dados."], ["P(A∪B)=P(A)+P(B)−P(A∩B). P(A", "B)=P(A∩B)/P(B). Independência implica P(A∩B)=P(A)P(B). Bayes atualiza probabilidades a partir de evidências.", "Dois eventos independentes com probabilidades 0,3 e 0,5 têm interseção 0,15.", "Eventos mutuamente exclusivos com probabilidades positivas não são independentes."]], "Sustentabilidade": [["ESG reúne aspectos ambientais, sociais e de governança. Stakeholders são partes interessadas. GRI orienta relato de impactos sobre economia, ambiente e pessoas. Materialidade de impacto considera impactos significativos; materialidade financeira considera efeitos sobre perspectivas financeiras.", "Vazamento de óleo pode ser material pelo impacto ambiental mesmo antes de mensurar prejuízo financeiro.", "ESG não é apenas meio ambiente; divulgar indicador não prova bom desempenho."], ["Escopo 1: emissões diretas de fontes controladas; escopo 2: energia adquirida; escopo 3: demais emissões indiretas da cadeia de valor. Ecoeficiência relaciona valor a consumo e impacto. Economia circular busca reduzir desperdício e preservar valor dos recursos.", "Combustível queimado em frota própria: escopo 1; eletricidade comprada: escopo 2.", "Redução de intensidade por tonelada não garante redução absoluta de emissões."]], "Português": [["Interpretação exige separar tese, argumentos, informações explícitas e inferências sustentadas. Coesão usa pronomes, elipses e conectores; coerência envolve sentido global. Entretanto indica oposição; portanto conclusão; embora concessão; porque causa ou explicação conforme contexto.", "Embora os custos tenham aumentado, a operação continuou: concessão.", "Não escolha alternativa verdadeira no mundo real se não for sustentada pelo texto."], ["Concordância: haver existencial e fazer indicando tempo são impessoais. Regência: assistir no sentido de ver exige a na norma tradicional; preferir X a Y. Crase resulta da fusão de a preposição com a artigo ou certos demonstrativos. Vírgula separa intercalações, não sujeito e predicado diretamente.", "Havia problemas; fazem os técnicos a revisão, mas faz dois anos. Referiu-se à gerente; referiu-se ao gerente.", "Não há crase antes de verbo; em regra não há antes de palavra masculina. Observe exceções de locuções e elipses."], ["Próclise ocorre com atratores como não e pronomes relativos; ênclise é comum sem atrator em início de oração na norma formal. Orações adjetivas restritivas delimitam referentes; explicativas acrescentam informação e são isoladas por vírgulas. Acentuação: todas as proparoxítonas são acentuadas.", "Os funcionários que estudaram passaram: restringe o grupo. Os funcionários, que estudaram, passaram: apresenta explicação sobre o grupo.", "Alterar pontuação pode mudar sentido, não apenas ritmo."]], "Inglês": [["Skimming identifica assunto e tese; scanning localiza informação específica. Inferência depende de pistas textuais. Connectors: however (contraste), therefore (conclusão), although (concessão), because (causa). Pronoun reference exige localizar antecedente compatível.", "Although costs increased, demand remained stable: apesar do aumento de custos, a demanda ficou estável.", "Actually significa na verdade; currently significa atualmente; eventually significa por fim."], ["Modal verbs: must indica obrigação ou dedução forte; may/might possibilidade; should recomendação. Passive voice: be + past participle. Present perfect relaciona passado ao presente; simple past situa evento passado concluído. Conditionals expressam condições reais ou hipotéticas.", "The report was approved: o relatório foi aprovado. If costs rise, profits may fall: possibilidade condicionada.", "Must not indica proibição; do not have to indica ausência de obrigação. Não traduza literalmente sem contexto."]]};function theory(){app.innerHTML=`<h2>Biblioteca de estudo aprofundada</h2><p>Estude os capítulos, refaça os exemplos e revise as fichas originais. Material autoral de preparação, não comentário oficial da banca.</p><label for="theorySearch">Pesquisar assunto</label><p><input id="theorySearch" style="background:white;color:black;width:100%" placeholder="Ex.: VPL, crase, estoque" oninput="filterTheory(this.value)"></p><div id="theoryChapters">${Object.entries(L).map(([t,ls])=>`<article class="theoryChapter"><h3>${t}</h3>${(expandedTheory[t]||[]).map(([a,b,c],i)=>`<section style="border-bottom:1px solid #b00020;padding:12px 0"><h4>Unidade ${i+1}</h4><p>${a}</p><p><b>Exemplo resolvido:</b> ${b}</p><p style="background:#b00020;color:white;padding:12px;border-radius:8px"><b>Atenção na prova:</b> ${c}</p></section>`).join('')}<h4>Fichas de revisão rápida</h4>${ls.map(([n,e])=>`<details><summary>${n}</summary><p>${e}</p></details>`).join('')}</article>`).join('')}</div>`}function filterTheory(v){const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();document.querySelectorAll('.theoryChapter').forEach(e=>e.hidden=!norm(e.textContent).includes(norm(v)))}function setup(){app.innerHTML=`<h2>Banco de questões autorais</h2><article><p>Treino: correção imediata. Simulado: gabarito ao finalizar. Somente questões ainda não respondidas. Escolha uma disciplina do edital. Há exercícios conceituais e séries de cálculos com valores diferentes. Português e Inglês reais estão na aba Provas reais.</p><p>Assunto <select id=topic><option>Todos</option>${Object.keys(L).filter(t=>!["Português","Inglês"].includes(t)).map(t=>`<option>${t}</option>`).join('')}</select></p><p>Quantidade <select id=count><option>10</option><option>20</option><option>30</option><option>50</option><option>70</option><option value=999>Todas</option></select></p><button onclick="start(false)">Iniciar treino</button> <button onclick="start(true)">Iniciar simulado</button></article>`}function start(exam,ids){ids=ids||Q.map((q,i)=>i).filter(i=>!historyData[i]&&!['Português','Inglês'].includes(Q[i].t)&&(topic.value==='Todos'||Q[i].t===topic.value)).sort(()=>Math.random()-.5).slice(0,+count.value);if(!ids.length){alert("Não há questões inéditas neste filtro. Revise o caderno de erros ou escolha outro assunto.");return;}session={ids,exam,pos:0,answers:{},seen:{},start:Date.now(),limit:ids.length*180};show();clearInterval(timer);if(exam)timer=setInterval(()=>{let left=session.limit-Math.floor((Date.now()-session.start)/1000);if(left<=0){finish();return}let c=document.getElementById('clock');if(c)c.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},500)}function record(i,a){let h=historyData[i]||{total:0,ok:0};h.total++;h.ok+=Number(a===Q[i].a);h.last=a===Q[i].a;historyData[i]=h;save()}function choose(a){let i=session.ids[session.pos];if(!session.exam&&session.seen[i])return;session.answers[i]=a;if(!session.exam){session.seen[i]=true;record(i,a)}show()}function show(){let s=session,i=s.ids[s.pos],q=Q[i],a=s.answers[i],checked=!s.exam&&s.seen[i];app.innerHTML=`<span id=clock></span><small>Questão ${s.pos+1}/${s.ids.length} • ${q.t} • Autoral</small><progress max=${s.ids.length} value=${Object.keys(s.answers).length}></progress><article><h3>${q.q}</h3><div class=opts>${q.o.map((o,j)=>`<button ${checked?'disabled':''} class="${checked?(j===q.a?'good':j===a?'bad':''):j===a?'selected':''}" onclick="choose(${j})">${'ABCDE'[j]}. ${o}</button>`).join('')}</div>${checked?`<h3>${a===q.a?'✓ Correta':'✗ Incorreta'}</h3><p>Gabarito: ${'ABCDE'[q.a]} — ${q.o[q.a]}. ${q.e}</p>`:''}</article><button onclick="move(-1)" ${s.pos===0?'disabled':''}>Anterior</button> <button onclick="move(1)" ${s.pos===s.ids.length-1?'disabled':''}>Próxima</button> <button onclick="finish()">Finalizar</button>`}function move(d){session.pos+=d;show()}function finish(){clearInterval(timer);let s=session;if(s.exam&&!s.done){s.ids.forEach(i=>{if(s.answers[i]!==undefined)record(i,s.answers[i])});s.done=true}let k=s.ids.filter(i=>s.answers[i]===Q[i].a).length;app.innerHTML=`<h2>Resultado: ${k}/${s.ids.length} (${Math.round(k/s.ids.length*100)}%)</h2><p>Não respondidas: ${s.ids.length-Object.keys(s.answers).length}</p>`+s.ids.map(i=>{let q=Q[i],a=s.answers[i];return `<article><small>${a===q.a?'✓ Acerto':a===undefined?'— Em branco':'✗ Erro'}</small><h3>${q.q}</h3><p>Sua resposta: ${q.o[a]||'Em branco'}</p><p><b>Gabarito: ${'ABCDE'[q.a]} — ${q.o[q.a]}</b></p><p>${q.e}</p></article>`}).join('')}function errors(){let ids=Object.keys(historyData).map(Number).filter(i=>!historyData[i].last&&Q[i]);app.innerHTML=`<h2>Caderno de erros (${ids.length})</h2>${ids.length?'<button onclick="start(false,'+JSON.stringify(ids)+')">Refazer erros</button>':'<p>Nenhum erro pendente.</p>'}`+ids.map(i=>`<article>${Q[i].q}<details><summary>Revisar conceito</summary>${Q[i].e}</details></article>`).join('')}function sources(){app.innerHTML=`<h2>TRANSPETRO 2023 — Administração</h2><article><p><a target=_blank href="https://arquivos.qconcursos.com/prova/arquivo_prova/101215/cesgranrio-2023-transpetro-profissional-transpetro-de-nivel-superior-junior-enfase-1-administracao-prova.pdf">Caderno original de 70 questões</a> · <a target=_blank href="https://arquivos.qconcursos.com/prova/arquivo_gabarito/101238/cesgranrio-2023-transpetro-profissional-transpetro-de-nivel-superior-junior-enfase-23-engenharia-geotecnica-gabarito.pdf">Gabarito retificado em 09/01/2024</a></p><p>Leia o caderno externo e marque o cartão. Questão 50 anulada, excluída do percentual de treino.</p><div class=grid>${key.map((a,i)=>`<label>${i+1} · ${i<10?'Português':i<20?'Inglês':'Específica'} <select id=p${i}><option value="">—</option>${[...'ABCDE'].map(x=>`<option>${x}</option>`).join('')}</select></label>`).join('')}</div><button onclick="official()">Corrigir cartão</button><div id=officialResult></div></article>`}function official(){let n=0;officialResult.innerHTML=key.map((a,i)=>{let u=document.getElementById('p'+i).value;n+=+(u===a);return `<p>${i+1}: ${a==='X'?'Anulada':u===a?'✓ Correta':'✗ Incorreta'} · Sua resposta: ${u||'—'} · Gabarito: ${a==='X'?'Anulada':a}</p>`}).join('');officialResult.insertAdjacentHTML('afterbegin',`<h3>${n}/69 válidas</h3>`)}function real(){app.innerHTML=`<h2>Provas reais e referências</h2><article><a href="https://www.qconcursos.com/questoes-de-concursos/provas/cesgranrio-2023-transpetro-profissional-transpetro-de-nivel-superior-junior-enfase-1-administracao">TRANSPETRO 2023 — Administração</a><p><a href="https://www.acheprovas.com.br/provas-anteriores-transpetro">Acervo de provas TRANSPETRO 2001–2023</a></p><p>Enunciados reais disponíveis externamente. O banco offline é autoral.</p></article><article><a href="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/lei/l13303.htm">Lei 13.303/2016, arts. 28–91</a><p><a href="https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp123.htm">LC 123/2006, arts. 42–49</a></p></article>`}function edital2026(){app.innerHTML=`<h2>Edital 2026 — Ênfase 1</h2><article><a href="https://transpetro.com.br/lumis/portal/file/fileDownload.jsp?fileId=4028908C9E22CAA601A1D66CCFC97F95">Edital consolidado oficial — Anexo IV</a><p>14 áreas específicas, Português e Inglês. Revisão de todos os eixos, não substitui leitura integral do edital e legislação.</p></article><article><h3>Reta final — 10 dias</h3>${['Finanças','Contabilidade','Produção e compras','Contratação','Projetos e negociação','Estratégia e marketing','RH e sistemas','Decisão, lógica e estatística','Sustentabilidade e simulado','Revisão de erros'].map((x,i)=>`<p>Dia ${i+1}: ${x}</p>`).join('')}<p>Português e Inglês diariamente.</p></article>`+Object.entries(L).map(([t,v])=>`<article><h3>${t}</h3>${v.map(([n,e])=>`<details><summary>${n}</summary><p>${e}</p></details>`).join('')}</article>`).join('')}const videoDirect={"Finanças": ["Revisão de Administração — Omega Ensino", "BXhvunQ3ikE", 3730], "Produção e compras": ["Gestão de materiais — Omega Ensino", "BXhvunQ3ikE", 2900], "Contratação": ["Lei das Estatais — Omega Ensino", "BXhvunQ3ikE", 4590], "Estratégia": ["Gestão estratégica — Omega Ensino", "BXhvunQ3ikE", 1110], "RH": ["Gestão de pessoas — Omega Ensino", "BXhvunQ3ikE", 2025], "Contabilidade": ["Demonstrações financeiras — Omega Ensino", "BXhvunQ3ikE", 3730], "Inglês": ["Inglês para Transpetro — Renato Baggio", "zWCVlGkItdg", 0], "Português": ["Português para Transpetro — Lucas Nunes", "DaD_uy5cRU4", 0]};let videoDone={};try{videoDone=JSON.parse(localStorage.getItem('adminprep-videos')||'{}')}catch(e){};function videoToggle(id,checked){videoDone[id]=checked;try{localStorage.setItem('adminprep-videos',JSON.stringify(videoDone))}catch(e){};document.getElementById('videoProgress').textContent=Object.values(videoDone).filter(Boolean).length+' itens concluídos'}function videoFilter(){let v=document.getElementById('videoSearch').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let t=document.getElementById('videoTopic').value;document.querySelectorAll('.videoItem').forEach(e=>e.hidden=(t!=='Todas'&&e.dataset.topic!==t)||!e.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(v))}const extraVideos={"Projetos": [["Gestão de projetos — Marcelo Soares (fundamentos e EAP)", "https://www.youtube.com/watch?v=U1Sweidt0Vs"], ["PMBOK 7 — Ricardo Vargas", "https://ricardo-vargas.com/pt/videos/understand-the-pmbok-guide-7th-ed-in-10-minutes-with-ricardo-vargas/"]], "Conflitos e negociação": [["Planejamento de negociações eficazes — ESMPU (página com vídeos)", "https://escola.mpu.mp.br/plataforma-aprender/acervo-educacional/conteudo/planejamento-de-negociacoes-eficazes-1"]], "Sistemas de informação": [["ERP — Uninter (página de aula)", "https://ava.grupouninter.com.br/ccdd/producao/ccdd_grad/nc/fundamentosSI/a2/"]], "Marketing": [["Segmentação de mercado — Uninter (página de aula)", "https://ava.grupouninter.com.br/ccdd/producao/ccdd_grad/adm/admMarketing2/a4/"]], "Processo decisório": [["Processo decisório — parte 1", "https://www.youtube.com/watch?v=f_KVbdt3Ov4"]], "Lógica": [["Análise combinatória — Douglas de Souza", "https://www.youtube.com/watch?v=0h5aYWPTkwM"]], "Estatística": [["Variáveis aleatórias discretas — Estatística para Concurso", "https://www.youtube.com/watch?v=jL5Q_JRvtsY"]], "Contabilidade": [["Contabilidade geral — Gabriel Rabelo", "https://www.youtube.com/watch?v=ELwxw7stViI"]]};function videos(){let rows=[];Object.keys(L).forEach((t,i)=>{let d=videoDirect[t];if(d)rows.push({t,id:'d'+i,n:d[0],url:'https://www.youtube.com/watch?v='+d[1]+'&t='+d[2]+'s'});(extraVideos[t]||[]).forEach(([n,url],j)=>rows.push({t,id:'new'+i+'-'+j,n,url}));if(!d&&!extraVideos[t])rows.push({t,id:'missing'+i,n:'Videoaula ainda não localizada',url:''})});app.innerHTML=`<h2>Videoaulas — Administração</h2><p>Links de vídeos específicos e páginas educacionais com aulas. A reprodução exige internet. Sem links de pesquisa.</p><p id="videoProgress">${Object.values(videoDone).filter(Boolean).length} itens concluídos</p><label>Disciplina <select id="videoTopic" onchange="videoFilter()"><option>Todas</option>${Object.keys(L).map(t=>`<option>${t}</option>`).join('')}</select></label><p><input id="videoSearch" style="width:100%;background:white;color:black" placeholder="Pesquisar assunto" oninput="videoFilter()"></p>${rows.map(r=>`<article class="videoItem" data-topic="${r.t}"><small>${r.t}</small><h3>${r.n}</h3>${r.url?`<p><a style="display:inline-block;background:#b00020;color:white;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:bold" href="${r.url}" target="_blank" rel="noopener noreferrer">▶ ${r.url.includes('youtube.com/watch')?'Assistir videoaula':'Abrir página da aula'} ↗</a></p><label><input type="checkbox" ${videoDone[r.id]?'checked':''} onchange="videoToggle('${r.id}',this.checked)"> Estudado</label>`:'<p>Sem indicação confirmada.</p>'}</article>`).join('')}`}
dashboard();</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(e => console.warn("Cache offline indisponível", e))); }</script></body></html>
